<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartStocker 1.6 (Pure JS Fixed)</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-blue-50 min-h-screen font-sans text-slate-800">
    <div id="root"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBA4GCW-DXP2SenQBotyF0G5PVZ5IPrpTc",
            authDomain: "work-stock-app.firebaseapp.com",
            projectId: "work-stock-app",
            storageBucket: "work-stock-app.firebasestorage.app",
            messagingSenderId: "283214115928",
            appId: "1:283214115928:web:7320ae287589c16455062d"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const { useState, useEffect, useRef, useMemo } = React;
        const e = React.createElement;

        const defaultCategories = ['事務用品', '日用品・清掃', 'トナー・インク', '用紙', 'その他'];
        const defaultUnits = ['個', '本', '箱', '冊', '包', '枚', 'セット'];
        const defaultTags = ['よく出る', '要発注', '発注済', '高額品'];
        const defaultVendors = ['アスクル', 'カウネット', 'Amazon', '地元業者', 'その他'];

        // バーコードスキャナー
        function BarcodeScanner({ onScan, onClose }) {
            const videoRef = useRef(null);
            const controlsRef = useRef(null);

            useEffect(() => {
                const startScanner = async () => {
                    try {
                        const ZXingLib = window.ZXing || ZebraXing; 
                        const codeReader = new ZXingLib.BrowserMultiFormatReader();
                        const devices = await codeReader.listVideoInputDevices();
                        if (!devices || devices.length === 0) {
                            alert("カメラが見つかりません。");
                            onClose();
                            return;
                        }
                        const device = devices.find(d =>
                            d.label.toLowerCase().includes('back') ||
                            d.label.toLowerCase().includes('rear') ||
                            d.label.includes('背面')
                        ) || devices[devices.length - 1];

                        controlsRef.current = await codeReader.decodeFromVideoDevice(
                            device.deviceId,
                            videoRef.current,
                            (result) => {
                                if (result) {
                                    if (controlsRef.current) controlsRef.current.stop();
                                    onScan(result.getText());
                                }
                            }
                        );
                    } catch (err) {
                        console.error(err);
                        alert("カメラへのアクセスを許可してください。");
                        onClose();
                    }
                };
                startScanner();
                return () => {
                    if (controlsRef.current) {
                        try { controlsRef.current.stop(); } catch(e) {}
                    }
                };
            }, [onClose, onScan]);

            return e('div', { className: "fixed inset-0 bg-slate-900/90 z-[60] flex flex-col items-center justify-center p-4" },
                e('div', { className: "w-full max-w-md bg-white rounded-2xl overflow-hidden shadow-2xl" },
                    e('div', { className: "p-4 bg-blue-600 text-white font-bold flex justify-between items-center text-sm" },
                        e('span', null, "📷 バーコードをスキャン"),
                        e('button', { onClick: onClose, className: "bg-blue-700 px-3 py-1 rounded-lg" }, "閉じる")
                    ),
                    e('video', { ref: videoRef, className: "w-full", style: { maxHeight: '300px', objectFit: 'cover' } }),
                    e('div', { className: "p-4 text-center text-xs text-slate-500 font-bold bg-slate-50" }, "商品のバーコードをカメラに向けてください。")
                )
            );
        }

        function App() {
            const [groupId, setGroupId] = useState(localStorage.getItem('smartstocker_group') || '');
            const [isLoggedIn, setIsLoggedIn] = useState(!!groupId);
            const [items, setItems] = useState([]);
            const [categories, setCategories] = useState(defaultCategories);
            const [units, setUnits] = useState(defaultUnits);
            const [tagsMaster, setTagsMaster] = useState(defaultTags);
            const [vendors, setVendors] = useState(defaultVendors);
            const [errorMsg, setErrorMsg] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [filterCategory, setFilterCategory] = useState('');
            const [filterTag, setFilterTag] = useState('');
            const [filterLowStock, setFilterLowStock] = useState(false);
            const [sortBy, setSortBy] = useState('category');
            const [showCategoryModal, setShowCategoryModal] = useState(false);
            const [showUnitModal, setShowUnitModal] = useState(false);
            const [showTagModal, setShowTagModal] = useState(false);
            const [showVendorModal, setShowVendorModal] = useState(false);
            const [newItemInput, setNewItemInput] = useState('');
            const [isProcessing, setIsProcessing] = useState(false);
            const [itemModal, setItemModal] = useState({ isOpen: false, mode: 'add', itemId: null });
            const [formData, setFormData] = useState({
                name: '', category: '', unit: '', currentStock: 0, orderThreshold: 0, barcode: '', selectedTags: [], vendor: '', itemCode: ''
            });
            const [scanMode, setScanMode] = useState(null);

            useEffect(() => {
                if (!isLoggedIn) return;
                const unsubItems = db.collection(`groups/${groupId}/items`).orderBy('name').onSnapshot((snapshot) => {
                    setItems(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    setErrorMsg('');
                }, () => setErrorMsg("データ取得エラー: アクセス権限がありません。"));

                const getMaster = (docName, setter, defaultList) => {
                    return db.collection(`groups/${groupId}/settings`).doc(docName).onSnapshot((snap) => {
                        if (snap.exists && snap.data().list && snap.data().list.length > 0) setter(snap.data().list);
                        else { setter(defaultList); db.collection(`groups/${groupId}/settings`).doc(docName).set({ list: defaultList }, { merge: true }); }
                    });
                };
                const unsubCat = getMaster('categories', setCategories, defaultCategories);
                const unsubUnit = getMaster('units', setUnits, defaultUnits);
                const unsubTag = getMaster('tags_master', setTagsMaster, defaultTags);
                const unsubVendor = getMaster('vendors', setVendors, defaultVendors);
                return () => { unsubItems(); unsubCat(); unsubUnit(); unsubTag(); unsubVendor(); };
            }, [isLoggedIn, groupId]);

            const displayedItems = useMemo(() => {
                let filtered = items;
                if (filterLowStock) {
                    filtered = filtered.filter(item => {
                        const threshold = item.orderThreshold !== undefined ? item.orderThreshold : (item.minStock !== undefined ? item.minStock : 0);
                        return item.currentStock <= threshold;
                    });
                }
                if (filterCategory) filtered = filtered.filter(item => item.category === filterCategory);
                if (filterTag) filtered = filtered.filter(item => item.selectedTags && item.selectedTags.includes(filterTag));
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    filtered = filtered.filter(item =>
                        (item.name && item.name.toLowerCase().includes(q)) || (item.barcode && item.barcode.includes(q)) || (item.itemCode && item.itemCode.toLowerCase().includes(q))
                    );
                }
                return filtered.sort((a, b) => {
                    if (sortBy === 'category') {
                        const idxA = categories.indexOf(a.category); const idxB = categories.indexOf(b.category);
                        if (idxA !== idxB) return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
                    } else if (sortBy === 'tag') {
                        const idxA = (a.selectedTags && a.selectedTags.length > 0) ? tagsMaster.indexOf(a.selectedTags[0]) : 999;
                        const idxB = (b.selectedTags && b.selectedTags.length > 0) ? tagsMaster.indexOf(b.selectedTags[0]) : 999;
                        if (idxA !== idxB) return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
                    } else if (sortBy === 'vendor') {
                        const idxA = vendors.indexOf(a.vendor); const idxB = vendors.indexOf(b.vendor);
                        if (idxA !== idxB) return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
                    }
                    return (a.name || '').localeCompare(b.name || '');
                });
            }, [items, filterLowStock, filterCategory, filterTag, searchQuery, sortBy, categories, tagsMaster, vendors]);

            const handleLogin = (e) => {
                e.preventDefault();
                const id = e.target.groupInput.value.trim();
                if (id) { setGroupId(id); localStorage.setItem('smartstocker_group', id); setIsLoggedIn(true); }
            };

            const updateStock = (id, change, current) => {
                db.collection(`groups/${groupId}/items`).doc(id).update({ currentStock: Math.max(0, current + change) });
            };

            const toggleTag = (tag) => {
                setFormData(prev => ({ ...prev, selectedTags: prev.selectedTags?.includes(tag) ? prev.selectedTags.filter(t => t !== tag) : [...(prev.selectedTags || []), tag] }));
            };

            const moveItemInArray = (list, index, direction, docName) => {
                const newList = [...list];
                if (direction === 'up' && index > 0) [newList[index - 1], newList[index]] = [newList[index], newList[index - 1]];
                else if (direction === 'down' && index < list.length - 1) [newList[index], newList[index + 1]] = [newList[index + 1], newList[index]];
                else return;
                db.collection(`groups/${groupId}/settings`).doc(docName).set({ list: newList }, { merge: true });
            };

            const handleMasterAdd = (list, docName) => {
                const t = newItemInput.trim(); if (!t) return;
                db.collection(`groups/${groupId}/settings`).doc(docName).set({ list: [...new Set([...list, t])] }, { merge: true }).then(() => setNewItemInput(''));
            };

            const handleMasterRemove = (list, item, docName) => {
                if (window.confirm(`「${item}」を削除しますか？`)) db.collection(`groups/${groupId}/settings`).doc(docName).set({ list: list.filter(x => x !== item) }, { merge: true });
            };

            const handleExport = () => {
                if (items.length === 0) { alert('出力するデータがありません。'); return; }
                const exportData = items.map(item => ({
                    'ID': item.id, '品名': item.name, '分野': item.category, '単位': item.unit, '現在の在庫数': item.currentStock,
                    '発注アラート': item.orderThreshold !== undefined ? item.orderThreshold : (item.minStock || 0), '業者名': item.vendor || '', '商品コード': item.itemCode || '', 'バーコード': item.barcode || '', 'タグ': item.selectedTags ? item.selectedTags.join(', ') : ''
                }));
                const ws = XLSX.utils.json_to_sheet(exportData);
                ws['!cols'] = [{ wch: 22 }, { wch: 25 }, { wch: 15 }, { wch: 8 }, { wch: 12 }, { wch: 12 }, { wch: 15 }, { wch: 15 }, { wch: 15 }, { wch: 20 }];
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "在庫データ");
                XLSX.writeFile(wb, `SmartStocker_在庫データ_${new Date().toISOString().slice(0, 10)}.xlsx`);
            };

            const handleImport = async (ev) => {
                const file = ev.target.files[0]; if (!file) return;
                setIsProcessing(true);
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const wb = XLSX.read(data, { type: 'array' });
                        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                        let countNew = 0, countUpdate = 0;
                        for (const row of rows) {
                            if (!row['品名']) continue;
                            const payload = {
                                name: String(row['品名'] || '').trim(), category: String(row['分野'] || categories[0]), unit: String(row['単位'] || units[0]),
                                currentStock: Number(row['現在の在庫数']) || 0, orderThreshold: Number(row['発注アラート']) || 0, vendor: row['業者名'] ? String(row['業者名']).trim() : '',
                                itemCode: row['商品コード'] ? String(row['商品コード']).trim() : '', barcode: row['バーコード'] ? String(row['バーコード']).trim() : '',
                                selectedTags: row['タグ'] ? String(row['タグ']).split(',').map(t => t.trim()).filter(t => t) : []
                            };
                            if (row['ID']) { await db.collection(`groups/${groupId}/items`).doc(String(row['ID']).trim()).set(payload, { merge: true }); countUpdate++; }
                            else { await db.collection(`groups/${groupId}/items`).add(payload); countNew++; }
                        }
                        alert(`インポート完了！\n新規: ${countNew}件\n更新: ${countUpdate}件`);
                    } catch (err) { alert("形式を確認してください。"); }
                    setIsProcessing(false); ev.target.value = '';
                };
                reader.readAsArrayBuffer(file);
            };

            const renderMasterModal = (title, list, docName, closeFunc) => (
                e('div', { className: "fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50" },
                    e('div', { className: "bg-white rounded-2xl shadow-xl w-full max-w-sm p-4 sm:p-6" },
                        e('h3', { className: "font-black text-base text-slate-800 mb-4" }, title + "のカスタマイズ"),
                        e('div', { className: "flex gap-2 mb-4" },
                            e('input', { value: newItemInput, onChange: em => setNewItemInput(em.target.value), placeholder: "新しい項目", className: "flex-1 p-2 border-2 border-slate-200 rounded-lg font-bold text-sm outline-none" }),
                            e('button', { onClick: () => handleMasterAdd(list, docName), className: "bg-blue-600 text-white px-3 text-sm rounded-lg font-bold" }, "追加")
                        ),
                        e('ul', { className: "space-y-2 max-h-60 overflow-y-auto mb-4 pr-1" },
                            list.map((item, idx) => e('li', { key: item, className: "flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-200 text-sm" },
                                e('span', { className: "font-bold text-slate-700 truncate mr-2" }, item),
                                e('div', { className: "flex gap-1" },
                                    e('button', { onClick: () => moveItemInArray(list, idx, 'up', docName), className: "p-1 bg-white border border-slate-300 rounded" }, "🔼"),
                                    e('button', { onClick: () => moveItemInArray(list, idx, 'down', docName), className: "p-1 bg-white border border-slate-300 rounded" }, "🔽"),
                                    e('button', { onClick: () => handleMasterRemove(list, item, docName), className: "p-1 bg-red-50 text-red-500 border border-red-200 rounded font-bold ml-1" }, "✕")
                                )
                            ))
                        ),
                        e('button', { onClick: () => { closeFunc(false); setNewItemInput(''); }, className: "w-full p-2 bg-slate-200 text-slate-700 rounded-xl font-bold text-sm" }, "閉じる")
                    )
                )
            );

            if (!isLoggedIn) {
                return e('div', { className: "flex items-center justify-center h-screen p-4" },
                    e('div', { className: "bg-white p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-sm border border-blue-100" },
                        e('h1', { className: "text-2xl sm:text-3xl font-black text-blue-600 mb-2 tracking-tight" }, "SmartStocker ", e('span', { className: "text-lg text-blue-400" }, "1.6")),
                        e('p', { className: "text-slate-500 mb-6 font-medium text-sm" }, "職場IDを入力して在庫管理を開く"),
                        e('form', { onSubmit: handleLogin, className: "space-y-4" },
                            e('input', { name: "groupInput", type: "text", placeholder: "例: office-01", className: "w-full p-3 border-2 border-slate-200 rounded-xl font-bold focus:border-blue-500 outline-none", required: true }),
                            e('button', { type: "submit", className: "w-full bg-blue-600 text-white py-3 rounded-xl font-bold" }, "入室する")
                        )
                    )
                );
            }

            return e('div', { className: "max-w-4xl mx-auto p-2 sm:p-6 pb-24" },
                scanMode && e(BarcodeScanner, { onScan: (txt) => { if (scanMode === 'search') setSearchQuery(txt); else setFormData(p => ({ ...p, barcode: txt })); setScanMode(null); }, onClose: () => setScanMode(null) }),
                e('header', { className: "flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-100 gap-3" },
                    e('div', null,
                        e('h1', { className: "text-xl sm:text-2xl font-black text-blue-700 tracking-tight leading-none flex items-baseline gap-1" }, "SmartStocker ", e('span', { className: "text-sm font-bold text-blue-400" }, "1.6")),
                        e('p', { className: "text-[10px] sm:text-xs font-bold text-blue-400 mt-1" }, "ID: " + groupId)
                    ),
                    e('div', { className: "flex flex-wrap items-center gap-1.5 sm:gap-2 w-full sm:w-auto justify-end" },
                        e('button', { onClick: handleExport, disabled: isProcessing, className: "text-[10px] sm:text-xs font-bold bg-green-600 text-white px-2.5 py-1.5 rounded-lg" }, "⬇️ 出力"),
                        e('label', { className: "text-[10px] sm:text-xs font-bold bg-green-600 text-white px-2.5 py-1.5 rounded-lg cursor-pointer" }, "⬆️ 取込", e('input', { type: "file", accept: ".xlsx, .xls, .csv", onChange: handleImport, className: "hidden", disabled: isProcessing })),
                        e('span', { className: "w-px h-6 bg-slate-200 mx-1 hidden sm:block" }),
                        e('button', { onClick: () => { setFormData({ name: '', category: categories[0] || '', unit: units[0] || '', currentStock: 0, orderThreshold: 0, barcode: '', selectedTags: [], vendor: '', itemCode: '' }); setItemModal({ isOpen: true, mode: 'add', itemId: null }); }, disabled: isProcessing, className: "text-[10px] sm:text-xs font-bold bg-blue-600 text-white px-2.5 py-1.5 rounded-lg" }, "＋ 新規"),
                        e('button', { onClick: () => { localStorage.removeItem('smartstocker_group'); setIsLoggedIn(false); }, className: "text-[10px] sm:text-xs font-bold text-slate-500 px-2.5 py-1.5 bg-slate-100 rounded-lg border border-slate-200" }, "退出")
                    )
                ),
                errorMsg && e('div', { className: "mb-4 p-3 bg-red-100 text-red-700 text-sm font-bold rounded-xl" }, errorMsg),
                e('div', { className: "bg-white p-3 rounded-xl shadow-sm border border-slate-100 mb-4 space-y-2" },
                    e('div', { className: "flex flex-col sm:flex-row gap-2" },
                        e('div', { className: "flex-1 relative flex" },
                            e('span', { className: "absolute left-3 top-2.5 text-slate-400 text-sm" }, "🔍"),
                            e('input', { value: searchQuery, onChange: am => setSearchQuery(am.target.value), placeholder: "品名・バーコード・コード", className: "w-full pl-8 p-2 border-2 border-slate-200 rounded-l-xl text-sm font-bold outline-none" }),
                            e('button', { onClick: () => setScanMode('search'), className: "bg-blue-600 text-white px-3 rounded-r-xl font-bold flex items-center gap-1" }, "📷")
                        ),
                        e('label', { className: "flex items-center justify-center cursor-pointer text-xs font-bold text-red-600 bg-red-50 px-3 py-2 rounded-xl border border-red-200" },
                            e('input', { type: "checkbox", checked: filterLowStock, onChange: am => setFilterLowStock(am.target.checked), className: "mr-2 w-4 h-4" }), "⚠️ 要発注のみ表示"
                        )
                    ),
                    e('div', { className: "flex flex-wrap gap-2" },
                        e('select', { value: filterCategory, onChange: am => setFilterCategory(am.target.value), className: "flex-1 min-w-[90px] p-2 border-2 border-slate-200 rounded-lg text-xs font-bold bg-slate-50" }, e('option', { value: "" }, "全分野"), categories.map(c => e('option', { key: c, value: c }, c))),
                        e('select', { value: filterTag, onChange: am => setFilterTag(am.target.value), className: "flex-1 min-w-[90px] p-2 border-2 border-slate-200 rounded-lg text-xs font-bold bg-slate-50" }, e('option', { value: "" }, "全タグ"), tagsMaster.map(t => e('option', { key: t, value: t }, t))),
                        e('select', { value: sortBy, onChange: am => setSortBy(am.target.value), className: "flex-1 min-w-[110px] p-2 border-2 border-blue-200 rounded-lg text-xs font-bold bg-blue-50 text-blue-700" }, e('option', { value: "category" }, "分野順"), e('option', { value: "tag" }, "タグ順"), e('option', { value: "vendor" }, "業者順"), e('option', { value: "name" }, "名前順"))
                    )
                ),
                e('div', { className: "grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-4" },
                    displayedItems.length === 0 && e('div', { className: "col-span-full text-center py-10 text-slate-400 font-bold text-sm" }, "表示するアイテムがありません。"),
                    displayedItems.map(item => {
                        const th = item.orderThreshold !== undefined ? item.orderThreshold : (item.minStock !== undefined ? item.minStock : 0);
                        const isLow = item.currentStock <= th;
                        return e('div', { key: item.id, className: `p-3 sm:p-4 rounded-xl border-2 flex flex-col justify-between ${isLow ? 'bg-red-50/50 border-red-200' : 'bg-white border-slate-100'}` },
                            e('div', null,
                                e('div', { className: "flex flex-wrap items-center gap-1 mb-1.5" },
                                    isLow && e('span', { className: "bg-red-500 text-white text-[10px] font-black px-1.5 py-0.5 rounded" }, "要発注"),
                                    e('span', { className: "bg-blue-100 text-blue-700 text-[10px] font-bold px-1.5 py-0.5 rounded" }, item.category),
                                    item.selectedTags && item.selectedTags.map(tag => e('span', { key: tag, className: "bg-slate-100 text-slate-600 border border-slate-200 text-[10px] font-bold px-1.5 py-0.5 rounded-full" }, "🏷️" + tag))
                                ),
                                e('h3', { className: "text-sm sm:text-base font-black text-slate-800 leading-tight pr-8 relative" }, item.name,
                                    e('button', { onClick: () => { const th2 = item.orderThreshold !== undefined ? item.orderThreshold : (item.minStock !== undefined ? item.minStock : 0); setFormData({ ...item, selectedTags: item.selectedTags || [], barcode: item.barcode || '', vendor: item.vendor || '', itemCode: item.itemCode || '', orderThreshold: th2 }); setItemModal({ isOpen: true, mode: 'edit', itemId: item.id }); }, className: "absolute right-0 top-0 text-slate-300 text-sm" }, "✏️")
                                ),
                                (item.vendor || item.itemCode) && e('div', { className: "mt-2 text-xs sm:text-sm bg-amber-50 p-1.5 sm:p-2 rounded-lg border border-amber-200 flex items-center flex-wrap gap-2" },
                                    item.vendor && e('span', { className: "font-bold text-amber-900" }, "🏢 " + item.vendor),
                                    item.itemCode && e('span', { className: "font-bold text-slate-800" }, "コード: " + item.itemCode)
                                ),
                                item.barcode && e('p', { className: "text-[10px] text-slate-400 mt-2 font-mono break-all" }, "🔢 " + item.barcode)
                            ),
                            e('div', { className: "flex items-center justify-between mt-3 bg-white p-2 rounded-lg border border-slate-100" },
                                e('div', { className: "text-center w-1/3" },
                                    e('p', { className: "text-[10px] font-bold text-slate-400" }, "現在庫"),
                                    e('p', { className: `text-xl sm:text-2xl font-black ${isLow ? 'text-red-600' : 'text-slate-700'}` }, item.currentStock, e('span', { className: "text-xs ml-0.5 font-bold text-slate-400" }, item.unit))
                                ),
                                e('div', { className: "flex gap-1 w-2/3 justify-end" },
